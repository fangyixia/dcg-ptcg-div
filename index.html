<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>寶可夢錦標賽｜即將舉行賽程</title>
    <meta
      name="description"
      content="寶可夢 Championship Series 即將舉行的官方賽事一覽，含賽事連結、日期與舉辦地點。"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout">
      <header class="site-header">
        <div class="container header-inner">
          <div class="header-copy">
            <p class="kicker">Play! Pokémon · Championship Series</p>
            <h1>即將舉行賽程</h1>
            <p class="lede">
              整理自
              <a
                href="https://championships.pokemon.com/en-us/events?status=upcoming"
                target="_blank"
                rel="noopener noreferrer"
                >官方賽事頁面</a
              >，含每場賽事的詳情連結與舉辦地點。
            </p>
          </div>
          <dl class="header-stats" aria-label="資料摘要">
            <div>
              <dt>賽事數</dt>
              <dd id="stat-count">—</dd>
            </div>
            <div>
              <dt>資料更新</dt>
              <dd id="stat-updated">—</dd>
            </div>
          </dl>
        </div>
      </header>

      <main class="container">
        <section class="controls" aria-label="篩選">
          <div class="control-group">
            <label for="filter-type">賽事類型</label>
            <select id="filter-type">
              <option value="">全部類型</option>
            </select>
          </div>
          <div class="control-group">
            <label for="filter-region">地區</label>
            <select id="filter-region">
              <option value="">全部地區</option>
            </select>
          </div>
          <p id="meta" class="result-meta">載入中…</p>
        </section>

        <section id="status" class="notice" hidden></section>

        <section class="schedule-wrap" aria-label="賽事列表">
          <div class="schedule-head" aria-hidden="true">
            <span>日期</span>
            <span>賽事</span>
            <span>類型</span>
            <span>地點</span>
          </div>
          <ol id="event-list" class="schedule" aria-live="polite"></ol>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>非官方整理頁面。賽事資訊以 The Pokémon Company International 公告為準。</p>
        </div>
      </footer>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
