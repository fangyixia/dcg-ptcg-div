name: Update events and deploy Pages

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 06:00（台灣 14:00）更新賽事資料
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest events
        run: python scripts/fetch_events.py

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js data _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
