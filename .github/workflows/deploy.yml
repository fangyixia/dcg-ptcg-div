name: Update events and deploy Pages

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 06:00（台灣 14:00）更新賽事資料
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest events
        run: python scripts/fetch_events.py

      - name: Prepare site artifact
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
